name: Release (tag)

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_flags: "--win --x64"
            upload_glob: "release/build/*.exe"
          - os: macos-latest
            builder_flags: "--mac --x64"
            upload_glob: "release/build/*.dmg"
          - os: macos-latest
            builder_flags: "--mac --arm64"
            upload_glob: "release/build/*.dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (webpack)
        run: npm run build

      - name: Package + Publish (electron-builder)
        env:
          # electron-builder 发布到 GitHub Release 需要 token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder build ${{ matrix.builder_flags }} --publish always

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.upload_glob }}
